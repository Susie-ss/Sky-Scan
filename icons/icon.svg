<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="100%" stop-color="#f7c948"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bgGrad)"/>

  <!-- 云朵主体 -->
  <g transform="translate(64, 48)">
    <!-- 云朵阴影 -->
    <path d="M -22 8 Q -28 8 -28 2 Q -28 -6 -20 -7 Q -19 -16 -8 -17 Q 0 -22 10 -17 Q 22 -17 24 -7 Q 30 -6 30 2 Q 30 8 24 8 Z"
          fill="#000000" opacity="0.12" filter="url(#shadow)" transform="translate(1, 2)"/>
    <!-- 云朵本体 -->
    <path d="M -22 8 Q -28 8 -28 2 Q -28 -6 -20 -7 Q -19 -16 -8 -17 Q 0 -22 10 -17 Q 22 -17 24 -7 Q 30 -6 30 2 Q 30 8 24 8 Z"
          fill="#ffffff"/>
  </g>

  <!-- 扫描光束（从云朵下方射出） -->
  <g transform="translate(64, 70)">
    <!-- 主光束 -->
    <path d="M -16 0 L 16 0 L 22 30 L -22 30 Z" fill="url(#scanGrad)" opacity="0.85"/>
    <!-- 三条扫描线 -->
    <rect x="-26" y="8" width="52" height="2" rx="1" fill="#ffffff" opacity="0.9"/>
    <rect x="-24" y="16" width="48" height="2" rx="1" fill="#ffffff" opacity="0.75"/>
    <rect x="-22" y="24" width="44" height="2" rx="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 右上角小扫描点（点缀） -->
  <circle cx="96" cy="28" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="96" cy="28" r="6" fill="#ffffff" opacity="0.25"/>
</svg>
