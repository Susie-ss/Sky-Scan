<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>Sky Scan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:370px;min-height:320px;font-size:12px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8f9fb;color:#222;
}
.header{
  background:linear-gradient(135deg,#ff6b35,#f7c948);
  color:#fff;padding:12px 16px 8px;
}
.header h1{font-size:15px;font-weight:700}
.header p{font-size:10px;opacity:.85;margin-top:1px;margin-bottom:0}

/* 模式 Tab */
.mode-tabs{
  display:flex;gap:0;margin:0 14px;
  background:#fff;border:1px solid #e0e3e8;border-top:none;
  border-radius:0 0 8px 8px;overflow:hidden;
}
.mode-tabs button{
  flex:1;padding:7px 0;border:none;cursor:pointer;
  font-size:12px;background:#f8f9fb;color:#888;
  border-right:1px solid #e0e3e8;transition:all .15s;
}
.mode-tabs button:last-child{border-right:none}
.mode-tabs button.active{
  background:#fff;color:#ff6b35;font-weight:600;
  box-shadow:inset 0 -2px 0 #ff6b35;
}
.mode-tabs button:hover:not(.active){color:#555}

.body{padding:10px 14px 14px}

/* 检测结果区 */
.detect-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
  background:#fff;border:1px solid #e0e3e8;border-radius:8px;padding:8px 10px;
}
.detect-bar .found{font-size:11px;color:#555;flex:1}
.detect-bar button{
  padding:4px 10px;border:1px solid #ccc;border-radius:5px;
  background:#fff;cursor:pointer;font-size:11px
}
.detect-bar button:hover{background:#f0f2f5}

/* 表格选择下拉 */
.section{
  background:#fff;border:1px solid #e0e3e8;border-radius:8px;
  padding:8px 10px;margin-bottom:8px;
}
.section-title{
  font-size:11px;font-weight:600;color:#777;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px
}
select,input[type=number]{
  width:100%;padding:5px 8px;border:1px solid #d0d7de;
  border-radius:5px;font-size:12px;background:#fff
}

/* 列勾选 */
.col-grid{
  display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto;
  padding:2px 0
}
.col-grid label{
  display:flex;align-items:center;gap:3px;
  background:#f0f4ff;border:1px solid #c8d8ff;
  border-radius:4px;padding:3px 7px;cursor:pointer;font-size:11px;
  white-space:nowrap
}
.col-grid label:hover{background:#e0eaff}
.col-grid label input[type=checkbox]{margin:0}
.col-btns{display:flex;gap:6px;margin-top:6px}
.col-btns button{
  padding:2px 10px;border:1px solid #d0d7de;border-radius:4px;
  background:#fff;cursor:pointer;font-size:11px
}

/* 高级区 */
.adv-toggle{
  font-size:11px;color:#1a6cff;cursor:pointer;margin-top:4px;
  display:inline-block
}
.adv-panel{display:none;margin-top:6px}
.adv-panel.show{display:block}
.adv-panel .row{
  display:flex;align-items:center;gap:6px;margin-bottom:4px
}
.adv-panel .row label{flex:0 0 70px;font-size:11px;color:#777}
.adv-panel .row input{flex:1;padding:3px 6px;border:1px solid #d0d7de;border-radius:4px;font-size:11px}

/* 设置行 */
.set-row{
  display:flex;align-items:center;gap:8px;margin-bottom:6px
}
.set-row label{flex:0 0 72px;font-size:11px;color:#777}
.set-row input,.set-row select{flex:1}

/* 状态栏 */
.status{background:#eef3ff;border:1px solid #c8d8ff;border-radius:6px;padding:7px 10px;font-size:11px;color:#1a6cff;min-height:30px;margin-bottom:6px;word-break:break-all}
.progress-wrap{height:5px;background:#dde3ec;border-radius:3px;margin-bottom:6px;overflow:hidden}
.progress-bar{height:100%;background:#ff6b35;border-radius:3px;width:0%;transition:width .3s}
.count{text-align:center;font-size:10px;color:#999;margin-bottom:6px}

/* 按钮 */
.btn-row{display:flex;gap:6px}
.btn-row button{
  flex:1;padding:7px 0;border:none;border-radius:6px;
  cursor:pointer;font-size:12px;font-weight:500
}
#btnStart{background:#ff6b35;color:#fff}
#btnStart:hover{background:#e55a2b}
#btnStop{background:#e74c3c;color:#fff;display:none}
#btnStop:hover{background:#c0392b}
#btnExport{background:#27ae60;color:#fff}
#btnExport:hover{background:#1e8449}
#btnExport:disabled{background:#b7e7d0;cursor:not-allowed}
#btnDetect{background:#f0f4ff;color:#1a6cff;border:1px solid #c8d8ff!important}
#btnDetect:hover{background:#dce6ff}

/* 文章导出 UI */
.article-info{
  background:#fffef5;border:1px solid #f0e6b8;border-radius:8px;
  padding:10px 12px;margin-bottom:8px
}
.article-info .ai-title{
  font-size:13px;font-weight:700;color:#333;margin-bottom:4px;
  max-height:40px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical
}
.article-info .ai-meta{
  font-size:10px;color:#999;display:flex;gap:12px
}
.article-info .ai-meta span{white-space:nowrap}
.article-btn-detect{
  margin-top:8px;padding:4px 12px;
  border:1px solid #d0d7de;border-radius:5px;
  background:#fff;cursor:pointer;font-size:11px
}
.article-btn-detect:hover{background:#f0f2f5}

/* 文章导出按钮 */
#articleBtnExport{
  flex:1;padding:7px 0;border:none;border-radius:6px;
  cursor:pointer;font-size:12px;font-weight:500;
  background:#1a6cff;color:#fff
}
#articleBtnExport:hover{background:#1558d6}
#articleBtnExport:disabled{background:#b3d0ff;cursor:not-allowed}
</style>
</head>
<body>

<div class="header">
  <h1>☁️ Sky Scan</h1>
  <p>Auto-detect tables · Pagination · CSV / JSON / DOCX</p>
</div>

<!-- 模式 Tab 切换 -->
<div class="mode-tabs">
  <button id="modeTable" class="active">📊 表格采集</button>
  <button id="modeArticle">📄 文章导出</button>
</div>

<div class="body">

  <!-- ==================== 表格采集区域 ==================== -->
  <div id="tableSection">

    <!-- 表格检测 -->
    <div class="detect-bar">
      <span class="found" id="detectMsg">点击右侧按钮检测页面表格…</span>
      <button id="btnDetect">🔍 检测表格</button>
    </div>

    <!-- 表格选择 -->
    <div class="section" id="tablePicker" style="display:none">
      <div class="section-title">📋 选择表格</div>
      <select id="tableSelect"></select>
      <div class="col-grid" id="colGrid" style="margin-top:6px"></div>
      <div class="col-btns">
        <button id="btnCheckAll">全选</button>
        <button id="btnUncheckAll">取消</button>
      </div>
    </div>

    <!-- 分页配置 -->
    <div class="section">
      <div class="section-title">🔄 分页设置 <span id="paginationHint" style="color:#aaa;font-weight:400;font-size:10px"></span></div>
      <select id="paginationMode">
        <option value="auto">自动检测（推荐）</option>
        <option value="jump">跳至输入框跳转</option>
        <option value="next">点击下一页按钮</option>
        <option value="none">单页采集（不分页）</option>
      </select>

      <span class="adv-toggle" id="advToggle">▶ 高级选择器（可选）</span>
      <div class="adv-panel" id="advPanel">
        <div class="row">
          <label>下一页按钮</label>
          <input id="selNext" placeholder="如 .btn-next, button:has-text(>)" />
        </div>
        <div class="row">
          <label>跳至输入框</label>
          <input id="selJump" placeholder="如 input.jump-input, input[type=number]" />
        </div>
        <div class="row">
          <label>表格行</label>
          <input id="selRow" placeholder="如 table tbody tr, .el-table__body tr" />
        </div>
        <div class="row">
          <label>单元格</label>
          <input id="selCell" placeholder="留空 = td（自动）" />
        </div>
      </div>
    </div>

    <!-- 参数 -->
    <div class="set-row">
      <label>翻页延迟(ms)</label>
      <input id="delay" type="number" value="1500" min="300" max="30000" step="100" />
    </div>
    <div class="set-row">
      <label>每页条数</label>
      <input id="pageSize" type="number" value="0" min="0" placeholder="0=自动" />
    </div>
    <div class="set-row">
      <label>最大页数</label>
      <input id="maxPages" type="number" value="0" min="0" placeholder="0=全部" />
    </div>
    <div class="set-row">
      <label>导出格式</label>
      <select id="exportFmt">
        <option value="csv">CSV（Excel 可打开）</option>
        <option value="json">JSON</option>
      </select>
    </div>

    <!-- 状态 -->
    <div class="status" id="statusBar">👆 点击「检测表格」开始</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="count" id="countLabel">已采集：0 条</div>

    <div class="btn-row">
      <button id="btnStart">▶ 开始采集</button>
      <button id="btnStop">⏹ 停止</button>
      <button id="btnExport" disabled>⬇ 导出</button>
    </div>
  </div>

  <!-- ==================== 文章导出区域 ==================== -->
  <div id="articleSection" style="display:none">

    <div class="detect-bar">
      <span class="found" id="articleDetectMsg">打开文章页面后自动检测…</span>
      <button id="articleBtnDetect">🔍 检测文章</button>
    </div>

    <div class="article-info" id="articleInfo" style="display:none">
      <div class="ai-title" id="articleTitle"></div>
      <div class="ai-meta">
        <span id="articleWords">约 0 字</span>
        <span id="articleImages">0 张图片</span>
        <span id="articleSource"></span>
      </div>
    </div>

    <div class="set-row">
      <label>导出格式</label>
      <select id="articleExportFmt">
        <option value="docx">.docx（Word / WPS 直接打开）</option>
      </select>
    </div>

    <div class="status" id="articleStatusBar">👆 点击「检测文章」识别网页正文</div>

    <div class="btn-row" style="margin-top:6px">
      <button id="articleBtnExport" disabled>⬇ 导出为 Word</button>
    </div>
  </div>

</div>

<script src="vendor/jszip.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
